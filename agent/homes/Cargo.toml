# The home's actor (`light-node.md` §3.3), installed beside the home's
# credential actor: the pool of personal agents and their claims, built
# for the PVM with the guest toolchain: `just build-programs`.
[package]
name = "vos-homes"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
workspace = "../programs"

[lib]
name = "vos_homes"
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "vos-homes"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vos-sdk = { path = "../sdk" }
vos-wire = { path = "../wire" }
# `Personal`'s messages, which `Homes` sends its pool's agents.
vos-personal = { path = "../personal" }
