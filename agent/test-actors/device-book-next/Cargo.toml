# The device book's next release, for the test that holds its operations
# on a device still running the first and replays them once that device
# installs this: the same fields, a field beside them, and its handlers.
[package]
name = "device-book-next"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"
publish.workspace = true

[lib]
test = false
bench = false

[[bin]]
name = "device-book-next"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vos-sdk = { workspace = true }
vos-wire = { path = "../../wire" }
