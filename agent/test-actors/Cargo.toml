# Actors the SDK's tests run, built for the PVM with the guest toolchain:
# `just build-test-actors`. Each actor is a library (its state, handlers and
# message types, which other actors use) and a program (`actor_program!`).
[workspace]
members = ["counter", "ledger", "caller", "checksum", "tally", "tracker", "shop", "rounds"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
vos-sdk = { path = "../sdk" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
