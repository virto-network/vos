[package]
name = "vos-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The VOS actor SDK: contexts, tables and the actor side of the ABI."

[dependencies]
vos-sdk-macros = { workspace = true }
vos-wire = { workspace = true }
# The proofs a read at a window's cut is served with, checked in the kernel.
vos-tree = { workspace = true }
vos-pvm-precompiles = { path = "../../pvm/proof/precompiles", default-features = false, features = ["blake2b"] }

[dev-dependencies]
trybuild = "1"
