[package]
name = "vos-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The VOS node's formats and the stock actors' messages, on the actor ABI."

[dependencies]
# The actor ABI the formats carry.
vos-abi = { workspace = true }
scale = { package = "vos-pvm-codec", path = "../../pvm/codec", default-features = false, features = ["anchor"] }
# A package's proofs of its rows.
vos-tree = { workspace = true }
# BLAKE2b-256 of a whole buffer: the credential actor's scopes, bindings,
# open claims, and the personal agent's ids.
vos-pvm-precompiles = { workspace = true }
# The method ids of the stock actors' handlers, derived from their names
# at build time as the actors' own.
vos-sdk-macros = { workspace = true }

[dev-dependencies]
proptest = "1"
vos-pvm = { workspace = true }
