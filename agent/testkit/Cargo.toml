[package]
name = "vos-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A native host for VOS actor programs: the reference model of the default agent."
publish = false

[dependencies]
blake2 = "0.10"
vos-pvm = { workspace = true }
# For `programs` only: linking and deriving the guest programs tests and
# benches load.
vos-pvm-compiler = { workspace = true }
# The tree's longest key, which a read at a cut's rows are held to.
vos-tree = { workspace = true }
vos-wire = { workspace = true }

[dev-dependencies]
lz4_flex = "0.13"
proptest = "1"
tempfile = "3"
vos-jam = { workspace = true }
vos-pvm-precompiles = { workspace = true }
vos-pvm-program = { workspace = true }

[[bench]]
name = "batch"
harness = false
