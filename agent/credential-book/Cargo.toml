# The credential book (`light-node.md` §3.1), a local actor: the spaces the
# user is a member of, each device's handles there and the methods pinned,
# built for the PVM with the guest toolchain: `just build-programs`.
[package]
name = "vos-credential-book"
version = "0.1.0"
edition = "2024"
publish = false
workspace = "../programs"

[lib]
name = "vos_credential_book"
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "vos-credential-book"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vos-sdk = { path = "../sdk" }
# The books' types, which the app reads their queries by.
vos-wire = { path = "../wire" }
