# The default agent program, built for the PVM with the guest toolchain:
# `just build-programs`.
[package]
name = "vos-agent"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
workspace = "../programs"

[lib]
name = "vos_agent"
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "vos-agent"
path = "src/main.rs"
test = false
bench = false

[dependencies]
lz4_flex = { version = "0.13", default-features = false, features = ["checked-decode"] }
vos-pvm-program = { path = "../../pvm/program" }
vos-pvm-precompiles = { path = "../../pvm/proof/precompiles" }
vos-sdk = { path = "../sdk" }
vos-tree = { path = "../../pvm/tree" }
vos-abi = { path = "../../pvm/abi" }
vos-wire = { path = "../wire" }
