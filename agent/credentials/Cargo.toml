# The credential actor, a library actor installed in the agent whose
# methods it guards, built for the PVM with the guest toolchain:
# `just build-credentials`.
[package]
name = "vos-credentials"
version = "0.1.0"
edition = "2024"
publish = false
workspace = "../programs"

[lib]
name = "vos_credentials"
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "vos-credentials"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vos-sdk = { path = "../sdk" }
# The tree's hash and tags, the ring and the paths, as ingress reads them.
vos-wire = { path = "../wire" }
