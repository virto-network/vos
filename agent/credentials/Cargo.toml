# The credential actor, a library actor installed in the agent whose
# methods it guards, built for the PVM with the guest toolchain:
# `just build-programs`.
[package]
name = "vos-credentials"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
workspace = "../programs"

[lib]
name = "vos_credentials"
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "vos-credentials"
path = "src/main.rs"
test = false
bench = false

[features]
# The next release's test (`agent/test-actors/credentials-next`): the
# stock `auth` kernel written otherwise, so its device program differs
# while its claims do not.
next = []

[dependencies]
vos-sdk = { path = "../sdk" }
# The tree's hash and tags, the ring and the paths, as ingress reads them.
vos-wire = { path = "../wire" }
