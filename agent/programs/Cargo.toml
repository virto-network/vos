# The agent's guest programs, built for the PVM with the guest toolchain,
# each alone (`just build-programs`): the programs `programs.toml` names,
# which `just check-tiers` holds these members to. One lockfile, toolchain,
# target configuration and release profile for them all; no
# `.cargo/config.toml` above it, whose `build-std` would reach the host
# crates under `agent/`.
[workspace]
resolver = "3"
members = [
    "../default", "../representative", "../credentials", "../personal", "../payments", "../homes",
    "../credential-book", "../device-book",
]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
