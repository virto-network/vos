# `just deny`: the workspace's dependency graph, every feature on, held to
# an allowlist of licences compatible with the AGPL-3.0-or-later the
# workspace ships under, to the RustSec advisory database, and to the
# sources named here.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Each advisory left open, with what holds it: none has an upgrade the
# crate that pulls it accepts. Reviewed 2026-11-24.
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill unmaintained: heapless 0.7 under postcard 1; no code path on a target without atomics." },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 (timing): through elliptic-curve 0.13 under mls-rs-crypto-rustcrypto's P-256/P-384 code, compiled in and not reached: vmls builds the provider with suite 1 (X25519, Ed25519) alone, so a message naming another suite is refused before any key is used (`support/vmls/src/lib.rs`). Also in the lock under starknet-ff (Stwo's `poseidon252`), which no workspace feature builds. Fixed in 0.7 only, which elliptic-curve 0.13 does not take." },
]

[licenses]
version = 2
# The permissive licences the dependencies carry.
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
]
# The five crates the verifier kit vendors into a chain's runtime, under the
# GPL-3.0-or-later (`pvm/README.md`); no other crate takes it.
exceptions = [
    { name = "vos-anchor", allow = ["GPL-3.0-or-later"] },
    { name = "vos-statement", allow = ["GPL-3.0-or-later"] },
    { name = "vos-pvm-final-verifier", allow = ["GPL-3.0-or-later"] },
    { name = "vos-pvm-recair-air", allow = ["GPL-3.0-or-later"] },
    { name = "vos-pvm-poseidon2", allow = ["GPL-3.0-or-later"] },
]

[bans]
# A crate held twice fails, but those below, each with what pulls each
# version: no upgrade the crates that pull them accept removes them.
# Reviewed 2026-11-24.
multiple-versions = "deny"
skip = [
    { crate = "digest@0.10.7", reason = "blake2 0.10, sha2 0.10 and curve25519-dalek 4 take digest 0.10; sha3 0.11 takes 0.11." },
    { crate = "block-buffer@0.10.4", reason = "digest 0.10's; digest 0.11 takes block-buffer 0.12." },
    { crate = "crypto-common@0.1.7", reason = "digest 0.10's; digest 0.11 takes crypto-common 0.2." },
    { crate = "cpufeatures@0.2.17", reason = "sha2 0.10's and curve25519-dalek 4's; blake3 and keccak 0.2 take 0.3." },
    { crate = "hashbrown@0.14.5", reason = "dashmap 6's; indexmap 2 takes 0.17." },
    { crate = "hashbrown@0.15.5", reason = "the Stwo fork's, pinned at its revision; indexmap 2 takes 0.17." },
    { crate = "rand@0.8.6", reason = "the Stwo fork, pinned at its revision, and vos-pvm-recair take 0.8; quinn-proto 0.11 takes 0.10." },
    { crate = "chacha20@0.9.1", reason = "chacha20poly1305 0.10's (under mls-rs's RustCrypto provider); rand 0.10 (quinn-proto 0.11, vnet's QUIC) takes 0.10.2." },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17's; async-io, async-signal, errno, polling, quinn-udp, rustix, socket2 and tempfile take 0.61." },
    { crate = "syn@1.0.109", reason = "vos-pvm-proof-derive is written against syn 1; every other macro crate takes syn 2." },
    { crate = "syn@2.0.118", reason = "every macro crate but async-trait and vos-pvm-proof-derive takes 2.0.118; async-trait 0.1 (under mls-rs) takes 3.0.6." },
    { crate = "getrandom@0.2.17", reason = "vos-pvm-recair takes 0.2.17 directly, rand_core 0.6 and ring 0.17 (rustls and quinn, vnet's QUIC) take 0.2.17; mls-rs 0.57, quinn-proto 0.11, rand 0.10 and tempfile 3.25 take 0.4.3." },
    { crate = "itertools@0.12.1", reason = "the Stwo fork's, pinned at its revision; mls-rs 0.57, mls-rs-codec 0.7 take 0.14.0." },
    { crate = "rand_core@0.6.4", reason = "crypto-bigint 0.5, crypto-common 0.1, ed25519-dalek 2.2, elliptic-curve 0.13, rand 0.8 and rand_chacha 0.3 take 0.6.4; mls-rs 0.57, rand 0.10, chacha20 0.10 and getrandom 0.4 take 0.10.1." },
    { crate = "sec1@0.7.3", reason = "elliptic-curve 0.13 takes 0.7.3; mls-rs-crypto-rustcrypto 0.22 takes 0.8.1." },
    { crate = "spin@0.9.9", reason = "heapless 0.7 takes 0.9.9; mls-rs 0.57 takes 0.10.1." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The fork the workspace pins: the Stwo prover.
allow-git = [
    "https://github.com/olanod/stwo",
]
