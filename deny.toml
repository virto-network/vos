    { crate = "hashbrown@0.15.5", reason = "the Stwo fork's, pinned at its revision; indexmap 2 takes 0.17." },
    { crate = "syn@1.0.109", reason = "vos-pvm-proof-derive is written against syn 1; every other macro crate takes syn 2." },
    # The node's, each with what takes each version: two generations of
    # the RustCrypto crates (russh 0.65 and ed25519-dalek 3 on the newer;
    # mls-rs, snow, arti 0.47 and ed25519-dalek 2 on the older), arti's and
    # ratatui's own pins and the Windows crates of those; and a few of our
