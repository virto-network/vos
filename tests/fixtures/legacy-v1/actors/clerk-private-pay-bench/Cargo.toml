[workspace]

[package]
name = "clerk-private-pay-bench"
version = "0.1.0"
edition = "2024"

[features]
# `bin` gates the PVM entry-point block (`_start`/`accumulate`) the
# `#[actor]` macro emits under `cfg(all(target_arch = "riscv64",
# feature = "bin"))` — replaces the removed `vos::pvm_main!` macro.
default = ["bin"]
bin = []

[dependencies]
vos = { path = "../../../../../vos", default-features = false, features = ["macros", "service"] }
cipher-clerk = { git = "https://codeberg.org/Virto/CipherClerk.git", rev = "e9a7b0851f183c14dbd1635dbf0437c86682ad6f", default-features = false, features = ["signing", "viewing-keys", "notes", "pvm-precompile"] }
# cipher-clerk's `signing` feature pulls in rand_core/getrandom for OsRng;
# we never actually invoke OsRng (we use a deterministic seeded RNG) but
# need a custom backend so getrandom links on the riscv64em-vos target.
getrandom = { version = "0.2", default-features = false, features = ["custom"] }
rand_core = { version = "0.6", default-features = false }
blake2 = { version = "0.10", default-features = false }
# Step 1 verification: depend on vos-pvm-precompiles (no_std, no
# host-fallback feature) so the on-target inline-asm path
# compiles for riscv64em-vos.
# Use the precompile ABI owned by this repository.
vos-pvm-precompiles = { path = "../../../../../pvm/proof/precompiles" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
