[package]
name = "vos-jam"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "An agent on JAM, from its builder's side: its whole keyspace under one tree, on disk, the simulation and witnesses of its packages, the builder's loop, and a JAM node emulated in process."

