[package]
name = "vos-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VOS's HTTP front: a small HTTP/1.1 server on tokio (feature `server`), its public TLS, and the route table that translates VOS's HTTP routes onto the node API: the gateway's."

[features]
# The server (`server`), on tokio: the gateway's. A node reads the routes
# and the TLS alone.
server = ["dep:tokio", "dep:tokio-rustls"]

[dependencies]
base64 = "0.22"
httparse = "1"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
tracing = "0.1"
vos-api = { workspace = true }
vos-net = { workspace = true }
vos-wire = { workspace = true }
