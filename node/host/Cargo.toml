[package]
name = "vos-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The VOS node host: storage, the leader loops and ingress."

[dependencies]
# Exact: the workspace nightly is a 1.90 pre-release, which a later fjall
# release may outgrow.
fjall = "=3.1.12"
ed25519-dalek = "2"
getrandom = "0.2"
httparse = "1"
smol = "2"
subtle = { workspace = true }
tracing = "0.1"
ureq = "3"
vos-pvm = { workspace = true }
vos-raft = { workspace = true }
vos-wire = { workspace = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"
vos-pvm-compiler = { workspace = true }

[[test]]
name = "crash"
harness = false

[[test]]
name = "raft_crash"
harness = false

[[test]]
name = "blob_crash"
harness = false

[[test]]
name = "snapshot_crash"
harness = false

[[bench]]
name = "acceptance"
harness = false
