[package]
name = "vos-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The VOS node host: storage, the leader loops and ingress."

[features]
# Faults a test injects into a running node (`vos_node::faults`): never
# in a production build.
faults = []
# The masked prover (`vos_node_prover::masked`): a node built with it can
# prove its agents' statements (`Config::prover`).
prover = ["vos-node-prover/prove"]
# The carrier audit's prover, which discloses what it built each proof from
# (`vos_node_prover::masked::Disclosing`): its test alone (`just
# test-carriers`). No production build enables it.
disclosing = ["prover", "vos-node-prover/disclosing"]
# The end to end on chain (`just e2e-chain`): its test alone, against the
# PolkaJam testnet the recipe starts. No production build enables it.
chain = ["disclosing"]

[dependencies]
fjall = { workspace = true }
ed25519-dalek = "2"
quick_cache = { version = "0.6.24", default-features = false }
event-listener = "5"
futures-rustls = { version = "0.26", default-features = false, features = ["ring"] }
getrandom = "0.2"
# The space's genesis file, in hex.
hex = "0.4"
httparse = "1"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
smol = "2"
subtle = { workspace = true }
tracing = "0.1"
vos-net = { workspace = true }
vos-pvm = { workspace = true }
# An install's package is an ELF: the node derives its programs.
vos-pvm-compiler = { workspace = true }
vos-raft = { workspace = true }
vos-tree = { workspace = true }
# Where the space's representative anchors its roots.
vos-venue = { workspace = true }
# The prover worker: the statements of the agents a node leads proved,
# recorded and submitted.
vos-node-prover = { workspace = true }
vos-wire = { workspace = true }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring"] }

[dev-dependencies]
# Its integration tests only: never its unit tests, which build a second
# vos-node the checker's types do not unify with.
vos-checker = { path = "../checker" }
# A kernel run alone, as an attest runs it.
vos-testkit = { path = "../../agent/testkit" }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
proptest = "1"
tempfile = "3"
# JAM's tree over the whole keyspace, which the agent's root is a node of.
vos-jam = { workspace = true }
vos-pvm-program = { workspace = true }
# The mock of Kreivo's spaces pallet, which the Kreivo client's cluster
# tests anchor at, and its stored values' SCALE.
vos-venue = { workspace = true, features = ["mock"] }
parity-scale-codec = "3.7.5"
# The carrier audit's canary on a pool thread, as the prover's run.
rayon = "1"
# The node's binary runs on mimalloc: its tests run on it too.
mimalloc = "0.1.52"
# The window actor's accounts, which the end to end on chain writes.
cipher-clerk = { workspace = true, features = ["settlement"] }
# The JAM statements service the end to end on chain deploys, and the
# development tooling that deploys it on a PolkaJam testnet and anchors and
# submits there (`JamVenue`).
vos-statement-service = { workspace = true }
vos-jam-dev = { path = "../../tools/jam-dev" }

[[test]]
name = "crash"
harness = false

[[test]]
name = "raft_crash"
harness = false

[[test]]
name = "blob_crash"
harness = false

[[test]]
name = "snapshot_crash"
harness = false

[[test]]
name = "tree_crash"
harness = false

[[test]]
name = "cut_crash"
harness = false

[[bench]]
name = "acceptance"
harness = false

[[bench]]
name = "agents"
harness = false

[[bench]]
name = "verify"
harness = false

[[bench]]
name = "fan_in"
harness = false

[[bench]]
name = "log"
harness = false

[[bench]]
name = "store"
harness = false

[[bench]]
name = "tree"
harness = false

[[bench]]
name = "cuts"
harness = false

# The carrier audit: three nodes proving with the masked prover, every
# carrier of the run searched (`just test-carriers`, alone in its process).
[[test]]
name = "carriers"
required-features = ["disclosing"]

# The end to end on chain: three nodes anchoring at the Kreivo mock, then,
# migrated, at the JAM statements service on a PolkaJam testnet (`just
# e2e-chain`, which starts the testnet).
[[test]]
name = "chain"
required-features = ["chain"]
