[package]
name = "vos-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The VOS node host: storage, the leader loops and ingress."

[features]
# Faults a test injects into a running node (`vos_node::faults`): never
# in a production build.
faults = []

[dependencies]
# Exact: the workspace nightly is a 1.90 pre-release, which a later fjall
# release may outgrow.
fjall = "=3.1.12"
ed25519-dalek = "2"
event-listener = "5"
futures-rustls = { version = "0.26", default-features = false, features = ["ring"] }
getrandom = "0.2"
httparse = "1"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
smol = "2"
subtle = { workspace = true }
tracing = "0.1"
vos-net = { workspace = true }
vos-pvm = { workspace = true }
vos-raft = { workspace = true }
vos-wire = { workspace = true }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring"] }

[dev-dependencies]
# Its integration tests only: never its unit tests, which build a second
# vos-node the checker's types do not unify with.
vos-checker = { path = "../checker" }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
proptest = "1"
tempfile = "3"
vos-pvm-compiler = { workspace = true }

[[test]]
name = "crash"
harness = false

[[test]]
name = "raft_crash"
harness = false

[[test]]
name = "blob_crash"
harness = false

[[test]]
name = "snapshot_crash"
harness = false

[[bench]]
name = "acceptance"
harness = false

[[bench]]
name = "agents"
harness = false
