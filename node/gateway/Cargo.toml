[package]
name = "vos-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VOS's gateway: today's HTTP routes, public TLS, limits per address and leader-aware routing in front of nodes' binary APIs, holding no authority; and s4's SSH port with the vos-api subsystem."

[[bin]]
name = "vos-gateway"
path = "src/main.rs"

[features]
# The SSH port: s4's screens and the `vos-api` subsystem, on s4-server.
ssh = ["dep:s4-server", "dep:russh"]
# The onion service in process, on arti: the SSH port's and HTTP's own
# onion. One arti version a release, pinned exactly (its crates break
# monthly); built with `--ignore-rust-version`, as s4's crates are.
tor = [
    "ssh",
    "dep:arti-client",
    "dep:futures",
    "dep:safelog",
    "dep:serde_ignored",
    "dep:tor-cell",
    "dep:tor-config",
    "dep:tor-guardmgr",
    "dep:tor-hscrypto",
    "dep:tor-hsservice",
    "dep:tor-llcrypto",
    "dep:tor-proto",
    "dep:tor-rtcompat",
]
# arti's service-side proof of work, which no release has declared ready
# (its `experimental` bundle, with LGPL dependencies): the file's `pow`.
tor-pow = ["tor", "arti-client/hs-pow-full", "tor-hsservice/hs-pow-full"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
serde = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
vos-api = { workspace = true, features = ["client", "quic"] }
vos-http = { workspace = true }
vos-net = { workspace = true }
vos-wire = { workspace = true }
# An agent's identity, its creation record's BLAKE2b-256.
vos-pvm-precompiles = { workspace = true }
s4-server = { git = "https://codeberg.org/Virto/s4", rev = "b91c21e35bb0c0f2fa093dbe4352d2c1dffcf2c9", optional = true }
russh = { version = "0.61", default-features = false, features = ["ring", "flate2"], optional = true }
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "onion-service-service", "experimental-api", "static-sqlite", "vanguards"], optional = true }
futures = { version = "0.3", optional = true }
safelog = { version = "0.10", optional = true }
serde_ignored = { version = "0.1", optional = true }
tor-cell = { version = "=0.47.0", optional = true }
tor-config = { version = "=0.47.0", optional = true }
tor-guardmgr = { version = "=0.47.0", features = ["vanguards"], optional = true }
tor-hscrypto = { version = "=0.47.0", optional = true }
tor-hsservice = { version = "=0.47.0", optional = true }
tor-llcrypto = { version = "=0.47.0", optional = true }
tor-proto = { version = "=0.47.0", features = ["tokio"], optional = true }
tor-rtcompat = { version = "=0.47.0", features = ["tokio", "rustls"], optional = true }

[dev-dependencies]
futures = "0.3"
# The tests run real nodes behind the gateway: dev edges only.
vos-node = { path = "../host" }
vos-checker = { path = "../checker" }
tempfile = "3"
# A CA and the certificate it signs, for a client trusting the CA.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
