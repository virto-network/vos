[package]
name = "vos-gateway-demo"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "The s4 demo on a local space: one node of a founded space with the credential actor, the poll and the ledger, test homes of personal agents beside it, and the gateway's SSH port and its onion, hosted by arti, serving the screens; and its end-to-end test, a headless s4 client proving with the device library."

# Outside VOS's workspace: s4's crates ask a newer Rust than the workspace's
# nightly, which builds them with `--ignore-rust-version`
# (`just test-gateway-ssh`), so `just check` never resolves them.
[workspace]

[[bin]]
name = "vos-gateway-demo"
path = "src/main.rs"

[dependencies]
vos-gateway = { path = "..", features = ["tor"] }
# The screens' app on the SSH port.
s4-server = { git = "https://codeberg.org/Virto/s4", rev = "345d4e49a4a90d3b8a4a56b51bde9be888806348" }
vos-node = { path = "../../host" }
vos-testkit = { path = "../../../agent/testkit" }
# The test homes' pools of personal agents.
vos-keeper = { path = "../../../tools/keeper" }
vos-abi = { path = "../../../pvm/abi" }
vos-wire = { path = "../../../agent/wire" }
vos-api = { path = "../../api" }
# An agent's identity, its creation record's BLAKE2b-256.
vos-pvm-precompiles = { path = "../../../pvm/proof/precompiles" }
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "io-std", "io-util", "signal", "sync"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"] }
toml = "1"
# The operator's terminal shows each home's code as a QR code, for the
# phone's Scan.
qrcode = { version = "0.15", default-features = false, features = ["std"] }

[dev-dependencies]
# The headless client: s4's protocol, and this tree's `vos.credential`
# facility.
s4-protocol = { git = "https://codeberg.org/Virto/s4", rev = "345d4e49a4a90d3b8a4a56b51bde9be888806348" }
vos-facility = { path = "../../light/android", features = ["testing"] }
s4-credential-contract = { git = "https://codeberg.org/Virto/s4", rev = "345d4e49a4a90d3b8a4a56b51bde9be888806348" }
# The carrier audit's search over what the onion carried, and the tests'
# waits.
vos-checker = { path = "../../checker" }
# The carrier audit's watch of a sign-in's masks.
vos-pvm-recair = { path = "../../../pvm/proof/recair", default-features = false, features = ["watch"] }
# A sign-in's device proof made and encoded outside the facility.
vos-pvm-device = { path = "../../../pvm/proof/device" }
tracing = "0.1"
# The stock kernels' release artifacts, from this tree's credential actor.
vos-light = { path = "../../light", features = ["release"] }
hmac = "0.12"
sha2 = "0.10"
zeroize = "1"

# As VOS's workspace: fjall's lsm-tree fork, and fjall's.
[patch.crates-io]
lsm-tree = { git = "https://github.com/olanod/lsm-tree", rev = "d0791931a96ff2be9b23af4e0d1ef17a330ed9f2" }
fjall = { git = "https://github.com/olanod/fjall", rev = "cffa5f7620be864277f7d5706a9f60e58beed219" }

# As VOS's workspace: the prover's crates optimized, since tests prove.
[profile.dev.package."*"]
opt-level = 3
# No debug info in dependencies, line tables alone in the crate, as the
# workspace's profiles.
debug = false

[profile.dev]
debug = "line-tables-only"
