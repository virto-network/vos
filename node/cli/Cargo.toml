[package]
name = "vos-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `vos` command: run a node, operate it, and call its agents."

[[bin]]
name = "vos"
path = "src/main.rs"

[features]
default = ["mimalloc"]
# A `vos` that injects the faults `VOS_FAULTS` names: for the process
# tests only.
faults = ["vos-node/faults"]
# mimalloc as the process's allocator; without it, the system's (which
# heap tools such as heaptrack, valgrind and sanitizers see).
mimalloc = ["dep:mimalloc", "dep:libc"]
# The masked prover: `vos node run` proves the statements of the agents
# the node leads and submits them at its venue, and `vos program-id`
# prints a kernel's program id.
prover = ["vos-node/prover", "dep:vos-node-prover", "vos-node-prover/prove"]

[dependencies]
mimalloc = { version = "0.1.52", optional = true }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
serde = { workspace = true }
toml = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
vos-node = { path = "../host" }
vos-node-prover = { workspace = true, optional = true }
vos-pvm = { workspace = true }
vos-pvm-compiler = { workspace = true }
vos-wire = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
futures-rustls = { version = "0.26", default-features = false, features = ["ring"] }
httparse = "1"
smol = "2"
vos-checker = { path = "../checker" }
# The agent-as-JAM-service builder's derivation, which an install's must
# equal.
vos-jam = { workspace = true }
tempfile = "3"

[[bench]]
name = "processes"
path = "benches/processes/main.rs"
harness = false
