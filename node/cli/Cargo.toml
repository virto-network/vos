[package]
name = "vos-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `vos` command: run a node, operate it, and call its agents."

[[bin]]
name = "vos"
path = "src/main.rs"

[features]
# A `vos` that injects the faults `VOS_FAULTS` names: for the process
# tests only.
faults = ["vos-node/faults"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
vos-node = { path = "../host" }
vos-pvm = { workspace = true }
vos-pvm-compiler = { workspace = true }
vos-wire = { workspace = true }

[dev-dependencies]
vos-checker = { path = "../checker" }
socket2 = "0.6"
tempfile = "3"
