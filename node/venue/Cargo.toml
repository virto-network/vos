[package]
name = "vos-venue"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A venue as a VOS node reaches it: anchoring a space's roots, submitting statements, and asking what is anchored; the anchor queue of a client that reaches a chain; and, for tests and tooling alone, the model venue the node's tests anchor at and the client of Kreivo's spaces pallet, against its mock."

# No production build enables these: a node carries no venue's client.
[features]
# The model venue, for the node's tests.
model = []
# The client of Kreivo's spaces pallet.
kreivo = ["dep:blake2", "dep:parity-scale-codec", "dep:twox-hash"]
# The reference mock of Kreivo's spaces pallet and a transport over it,
# for the node's tests.
kreivo-mock = ["kreivo"]

[dependencies]
blake2 = { version = "0.10", optional = true }
ed25519-dalek = "2"
# The spaces pallet's calls, events and stored values in SCALE, FRAME's
# bytes; its storage keys hashed as FRAME's hashers do (`twox128`,
# `twox64`, `blake2_128`).
parity-scale-codec = { version = "3.7.5", features = ["derive", "std"], optional = true }
tracing = "0.1"
twox-hash = { version = "2", default-features = false, features = ["xxhash64"], optional = true }
vos-anchor = { workspace = true }
vos-statement = { workspace = true }

[dev-dependencies]
# This crate's tests build the model venue, the Kreivo client and its
# mock whatever the features.
blake2 = "0.10"
parity-scale-codec = { version = "3.7.5", features = ["derive", "std"] }
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }
# The conformance vectors, as JSON.
serde = { workspace = true }
serde_json = "1"
# The golden fixtures the vectors submit, and their format-39 proofs'
# fields, which the mutation lists tamper.
vos-statement = { workspace = true, features = ["fixtures"] }
vos-pvm-final-verifier = { workspace = true }
stwo = { workspace = true }
