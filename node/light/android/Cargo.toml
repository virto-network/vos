[package]
name = "vos-facility"
version = "0.1.0"
description = "The vos.credential client facility: a VOS member's device credential, enrolled, kept and proved on the device for an s4 server that asks, and the device's personal space."
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://codeberg.org/Virto/VOS"
readme = "README.md"
publish = false

# Outside VOS's workspace: s4's crates ask a newer Rust than the
# workspace's nightly, which builds them with `--ignore-rust-version`
# (`just test-facility`), so `cargo clippy --workspace` never resolves them.
[workspace]

# The prover's dependencies optimized even in tests, which prove.
[profile.dev.package."*"]
opt-level = 3
# Line tables alone, in the dependencies too: `tests/leaks.rs` tells the
# device prover's frees from the others by the frames of a backtrace, and
# its code inlined into another crate keeps its frames only with that
# crate's line tables.
debug = "line-tables-only"

[profile.dev]
debug = "line-tables-only"

# The C ABI build is the shared library the app's `:vos` process loads,
# `libvos_facility.so`.
[lib]
crate-type = ["rlib", "cdylib"]

[features]
# The interfaces' types as their parcelables, read and made through JNI:
# s4's contract's and the facility's own (`personal::contract`).
jni = ["dep:jni", "s4-credential-contract/jni"]
# `libvos_facility.so` as the app's `:vos` process loads it: the facility
# on a runtime of its own behind the Binder interfaces' JNI, its chrome and
# its secret sources the UI process's, reached through the interface.
android = ["jni", "tokio/rt-multi-thread"]
# The facility's own interface's round trip on a JVM (`just
# facility-contract`), on s4's contract's harness.
jvm = ["jni", "s4-credential-contract/jvm"]
# The shared phone double as the facility's client lends it
# (`vos_light::testing`): the tests' and the tools'.
testing = ["vos-light/testing"]

[dependencies]
# The facility's protocol and its Binder contract: s4's, by git revision,
# as the gateway names s4-server.
s4-protocol = { git = "https://codeberg.org/Virto/s4", rev = "bca4bcd5611e84750a123ca2ddc2fe6c2a901a55" }
s4-credential-contract = { git = "https://codeberg.org/Virto/s4", rev = "bca4bcd5611e84750a123ca2ddc2fe6c2a901a55" }
# The light node, with its device library: the secret's derivation, the
# proofs, the node-API requests and the path kept apart from proofs.
vos-light = { path = "..", features = ["tor"] }
vos-api = { path = "../../api" }
vos-abi = { path = "../../../pvm/abi" }
vos-wire = { path = "../../../agent/wire" }
# The personal agent's calls, signed by the light node's sync key; the
# personal space's state in the light node's encoding.
ed25519-dalek = "2"
scale = { package = "vos-pvm-codec", path = "../../../pvm/codec", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "io-util", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
# The facility's database, on the light node's store's engine.
fjall = "=3.1.13"
hex = "0.4"
sha2 = "0.10"
getrandom = "0.2"
# A warm-up thread's priority, and the heap handed back after a device proof.
libc = "0.2"
zeroize = "1"
jni = { version = "0.22", optional = true }

[dev-dependencies]
# The release artifacts computed from this tree's guests, which the
# embedded ones must be; the personal agent's package the tests run.
vos-light = { path = "..", features = ["release", "tor", "testing"] }
vos-testkit = { path = "../../../agent/testkit" }
# The personal agent run in process, as a node runs it: the default agent's
# program over the interpreter, its work applied as accumulate applies it.
vos-exec = { path = "../../exec" }
vos-pvm = { path = "../../../pvm/runtime" }
s4-server = { git = "https://codeberg.org/Virto/s4", rev = "bca4bcd5611e84750a123ca2ddc2fe6c2a901a55" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
tempfile = "3"
hmac = "0.12"
blake2 = "0.10"
# The in-process gateway's SSH, as the light node's own tests run it.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"] }
# An answer's bytes as the server is answered.
ciborium = "0.2"

# As VOS's workspace: fjall's lsm-tree fork, and fjall's, which the light
# node's store runs on.
[patch.crates-io]
lsm-tree = { git = "https://github.com/olanod/lsm-tree", rev = "d0791931a96ff2be9b23af4e0d1ef17a330ed9f2" }
fjall = { git = "https://github.com/olanod/fjall", rev = "cffa5f7620be864277f7d5706a9f60e58beed219" }
