[package]
name = "vos-light"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "The light node: a device's local agent run on the interpreter over its own store with no log, installed from release artifacts; and the device library: a member's secret from a secret source, its proven calls, their verification, the node-API requests a client sends for them, and the path it keeps apart from its proofs."

[package.metadata.vos]
test-features = { seeded-masks = ["seeded-masks"] }

[features]
# The release build of the light node's artifacts from ELFs
# (`release::package`, `release::agent`): the transpiler, on the host that
# builds the app. The app's own build never enables it.
release = ["dep:vos-pvm-compiler"]
# The prover's seeded masks (`Prover::seeded`), so a proof's bytes are any
# machine's: the phone bench's seeded build alone. A test seam: no
# production build enables it (`just check-no-seeded-masks`).
seeded-masks = ["vos-pvm-device/seeded-masks"]
# The client over arti (`tor`): one `TorClient`, `vos-api` over SSH over a
# space's onion, a connection a purpose. One arti version a release,
# pinned exactly as the gateway's; built with `--ignore-rust-version`, as
# arti declares a newer Rust than the workspace's nightly.
tor = [
    "vos-api/client",
    "dep:arti-client",
    "dep:tor-rtcompat",
    "dep:rustls",
    "dep:russh",
    "dep:tokio",
    "dep:tokio-util",
    "dep:sha3",
    "dep:data-encoding",
]

# The personal space's test doubles (`testing`): one phone, one world of
# homes behind an in-process gateway, a phone's host over it. Tests and
# tools only.
testing = ["tor", "release", "dep:vos-testkit", "dep:hmac"]

[dependencies]
# The local agent's store.
fjall = { workspace = true }
# Each local instance's scope: its DAG of signed nodes, over the store.
merkle-crdt = { workspace = true, features = ["fjall"] }
# The agent program's runs over it, and the interpreter they run on.
vos-exec = { workspace = true }
vos-pvm = { workspace = true }
vos-pvm-compiler = { workspace = true, optional = true }
# The device kernels' programs, their masked prover and verifier.
vos-pvm-device = { workspace = true }
# The tags, the compression, the tree and the node API's types and kinds;
# the work an agent program runs, and its apply.
vos-abi = { workspace = true }
vos-wire = { workspace = true }
vos-api = { workspace = true }
vos-pvm-precompiles = { workspace = true }
scale = { package = "vos-pvm-codec", path = "../../pvm/codec", default-features = false }
rayon = { workspace = true }
# The derivation (BLAKE2b-512) and the source's input (SHA-256).
blake2 = "0.10"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
# A query's key, drawn for that query alone; and the device group's
# signatures checked: admin calls' evidence and votes.
ed25519-dalek = "2"
# The device group's MLS layer.
vos-mls = { workspace = true }
# The key archive's seal, and a kit's `R1`'s.
chacha20poly1305 = "0.10"
# A kit's sealing key, which its `R1` is sealed to.
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Pairing's channel: `Noise_XXpsk3_25519_ChaChaPoly_BLAKE2b` through the
# slot's inbox.
snow = { version = "0.9.6", default-features = false, features = ["default-resolver"] }
# A phrase kit's 24 words.
bip39 = { version = "2.2", default-features = false, features = ["zeroize"] }
# A query's key, and an operation's seed.
getrandom = "0.2"
# A pool's threads pinned to the cores `Threads::Cores` names.
libc = "0.2"
# The client over arti: arti's client with the bridge client and its
# directory cache's SQLite built in (the NDK offers apps none), rustls on
# ring as russh's and the gateway's, SSH under a key drawn a connection,
# and the onion's address from its key (SHA3-256, base32).
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "bridge-client", "static-sqlite"], optional = true }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"], optional = true }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
sha3 = { version = "0.10", optional = true }
data-encoding = { version = "2", optional = true }
# The test doubles' personal agents and keys (`testing`).
vos-testkit = { path = "../../agent/testkit", optional = true }
hmac = { version = "0.12", optional = true }

[dev-dependencies]
# The release build, as the tests compute the artifacts.
vos-light = { path = ".", features = ["release"] }
# The guest programs' ELFs, and their methods by name.
vos-testkit = { path = "../../agent/testkit" }
# The crash rounds.
vos-checker = { path = "../checker" }
tempfile = "3"
# The pinned device programs' ids (`tests/device.pins`).
hex = "0.4"
# The client over arti's tests: a runtime, as the facility's.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
# The merge fields' convergence, on their native model.
proptest = "1"
# The device group's adversaries: a committer running other code over a
# device's MLS state.
mls-rs = { version = "=0.57.0", default-features = false, features = ["private_message"] }
mls-rs-core = { version = "=0.27.0", default-features = false }
mls-rs-crypto-rustcrypto = { version = "=0.22.1", default-features = false }

[[test]]
name = "crash"
harness = false

[[test]]
name = "tor"
required-features = ["tor"]

[[test]]
name = "tor_state"
required-features = ["tor"]

[[test]]
name = "space"
required-features = ["testing"]

[[example]]
name = "onion"
required-features = ["tor"]
