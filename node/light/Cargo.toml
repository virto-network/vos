[package]
name = "vos-light"
edition.workspace = true
version.workspace = true
license = "Apache-2.0"
description = "The light node: a device's local agent run on the interpreter over its own store with no log, installed from release artifacts; and the device library: a member's secret from a secret source, its credential proofs, their verification, the node-API requests a client sends for them, and the path it keeps apart from its proofs."

[features]
# The release build of the light node's artifacts from ELFs
# (`release::package`, `release::agent`): the transpiler, on the host that
# builds the app. The app's own build never enables it.
release = ["dep:vos-pvm-compiler"]
# The prover's seeded masks (`Prover::seeded`), so a proof's bytes are any
# machine's: the phone bench's seeded build alone. A test seam: no
# production build enables it (`just check-no-seeded-masks`).
seeded-masks = ["vos-pvm-recair/seeded-masks"]

[dependencies]
# The local agent's store.
fjall = { workspace = true }
# The agent program's runs over it, and the interpreter they run on.
vos-exec = { workspace = true }
vos-pvm = { workspace = true }
vos-pvm-compiler = { workspace = true, optional = true }
# The credential circuits and their masked prover.
vos-pvm-recair = { workspace = true }
vos-pvm-recair-air = { workspace = true }
# The credential verifier, its pinned programs and a proof's bytes.
vos-pvm-final-verifier = { workspace = true, features = ["credential-bytes"] }
# The registry's credential format.
vos-pvm-proof = { workspace = true }
# The tags, the compression, the tree and the node API's types and kinds;
# the work an agent program runs, and its apply.
vos-wire = { workspace = true }
vos-api = { workspace = true }
vos-pvm-precompiles = { workspace = true }
scale = { package = "vos-pvm-codec", path = "../../pvm/codec", default-features = false }
stwo = { workspace = true }
rayon = { workspace = true }
num-traits = { workspace = true }
# The derivation (BLAKE2b-512) and the source's input (SHA-256).
blake2 = "0.10"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
# A query's key, drawn for that query alone.
ed25519-dalek = "2"
# A query's key, and an operation's seed.
getrandom = "0.2"
# A pool's threads pinned to the cores `Threads::Cores` names.
libc = "0.2"

[dev-dependencies]
# The release build, as the tests compute the artifacts.
vos-light = { path = ".", features = ["release"] }
# The guest programs' ELFs, and their methods by name.
vos-testkit = { path = "../../agent/testkit" }
# The crash rounds.
vos-checker = { path = "../checker" }
tempfile = "3"

[[test]]
name = "crash"
harness = false
