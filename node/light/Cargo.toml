[package]
name = "vos-light"
edition.workspace = true
version.workspace = true
license = "Apache-2.0"
description = "The light node: a device's local agent run on the interpreter over its own store with no log, installed from release artifacts; and the device library: a member's secret from a secret source, its proven calls, their verification, the node-API requests a client sends for them, and the path it keeps apart from its proofs."

[features]
# The release build of the light node's artifacts from ELFs
# (`release::package`, `release::agent`): the transpiler, on the host that
# builds the app. The app's own build never enables it.
release = ["dep:vos-pvm-compiler"]
# The prover's seeded masks (`Prover::seeded`), so a proof's bytes are any
# machine's: the phone bench's seeded build alone. A test seam: no
# production build enables it (`just check-no-seeded-masks`).
seeded-masks = ["vos-pvm-recair/seeded-masks"]

[dependencies]
# The local agent's store.
fjall = { workspace = true }
# Each local instance's scope: its DAG of signed nodes, over the store.
merkle-crdt = { workspace = true, features = ["fjall"] }
# The agent program's runs over it, and the interpreter they run on.
vos-exec = { workspace = true }
vos-pvm = { workspace = true }
vos-pvm-compiler = { workspace = true, optional = true }
# The device kernels' programs, their masked prover and verifier.
vos-pvm-recair = { workspace = true }
# The tags, the compression, the tree and the node API's types and kinds;
# the work an agent program runs, and its apply.
vos-wire = { workspace = true }
vos-api = { workspace = true }
vos-pvm-precompiles = { workspace = true }
scale = { package = "vos-pvm-codec", path = "../../pvm/codec", default-features = false }
rayon = { workspace = true }
# The derivation (BLAKE2b-512) and the source's input (SHA-256).
blake2 = "0.10"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
# A query's key, drawn for that query alone; and the device group's
# signatures checked: admin calls' evidence and votes.
ed25519-dalek = "2"
# The device group's MLS layer.
vos-mls = { workspace = true }
# The key archive's seal, and a kit's `R1`'s.
chacha20poly1305 = "0.10"
# A kit's sealing key, which its `R1` is sealed to.
x25519-dalek = { version = "2", features = ["static_secrets"] }
# A phrase kit's 24 words.
bip39 = { version = "2.2", default-features = false, features = ["zeroize"] }
# A query's key, and an operation's seed.
getrandom = "0.2"
# A pool's threads pinned to the cores `Threads::Cores` names.
libc = "0.2"

[dev-dependencies]
# The release build, as the tests compute the artifacts.
vos-light = { path = ".", features = ["release"] }
# The guest programs' ELFs, and their methods by name.
vos-testkit = { path = "../../agent/testkit" }
# The crash rounds.
vos-checker = { path = "../checker" }
tempfile = "3"
# The merge fields' convergence, on their native model.
proptest = "1"
# The device group's adversaries: a committer running other code over a
# device's MLS state.
mls-rs = { version = "=0.57.0", default-features = false, features = ["private_message"] }
mls-rs-core = { version = "=0.27.0", default-features = false }
mls-rs-crypto-rustcrypto = { version = "=0.22.1", default-features = false }

[[test]]
name = "crash"
harness = false

[[example]]
name = "devices"
required-features = ["release"]
