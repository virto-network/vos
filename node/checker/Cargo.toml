[package]
name = "vos-checker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The exactly-once checker's model, and what the node's tests and benches share: calls, hooks, spaces in one process, crash rounds and node processes."
publish = false

# vos-node's integration tests depend on this crate, which depends on
# vos-node: cargo allows it, as integration tests link the same library.
# vos-node's own unit tests must never use it, being a second instance.
[dependencies]
# The carrier audit's search: every needle in one pass over a carrier.
aho-corasick = "1"
# The carrier audit's hashes of private arguments: BLAKE3 beside the
# BLAKE2b-256 vos-wire computes.
blake3 = "1"
# The venues' encodings of what a node sends them: Kreivo's calls and the
# JAM statements service's items.
vos-venue = { workspace = true, features = ["kreivo"] }
vos-statement-service = { workspace = true }
# The prover's internals, which the carrier audit searches for.
vos-node-prover = { workspace = true }
# The carrier audit's capture of standard error.
libc = "0.2"
# The carrier audit's capture of every log line.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
ed25519-dalek = "2"
hex = "0.4"
smol = "2"
socket2 = "0.6"
tempfile = "3"
vos-node = { path = "../host" }
vos-testkit = { path = "../../agent/testkit" }
vos-wire = { workspace = true }

[dev-dependencies]
# The carrier audit's tests: a root laid out as postcard lays it out.
postcard = { version = "1", features = ["alloc"] }
