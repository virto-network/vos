# Codegen flags are set per target triple, never under `[build]`: cargo
# applies `[build] rustflags` to every `--target` build, and
# `target-cpu=native` names the host's CPU, which a cross-build's target
# does not know. A matching target section replaces `[build] rustflags`.

# Native codegen (AVX2, AES-NI, SHA-NI for Stwo's SimdBackend) speeds local
# proving; its binaries are not portable. A distributable build overrides
# it: RUSTFLAGS="" cargo build --release.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]

# aarch64 cross-builds link with the cross-gcc, which `cc` also finds for
# C dependencies (`ring`); no target-cpu pin, NEON being baseline. Android
# builds go through `cargo ndk`, which sets its own linker.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
