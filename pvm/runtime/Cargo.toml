[package]
name = "vos-pvm"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
authors.workspace = true
description = "Gray Paper v0.8.0 PVM runtime used by VOS."

[features]
default = ["std"]
std = ["dep:libc", "dep:memoffset"]

[dependencies]
libc = { version = "0.2", optional = true }
memoffset = { version = "0.9", optional = true }
vos-pvm-program = { path = "../program" }
# Not a workspace dependency: workspace pins enable default features, and
# vos_pvm's always-compiled modules must stay no_std-clean.
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
proptest = "1"
serde_json = "1"
