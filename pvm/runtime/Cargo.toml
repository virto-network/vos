[package]
name = "vos-pvm"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
authors.workspace = true
description = "Gray Paper v0.8.0 PVM runtime used by VOS."

[features]
default = ["std"]
std = ["dep:libc", "dep:memoffset"]
# The run's debug outputs: each instruction traced (its pc, opcode and gas)
# and, with `GREY_PVM_DEBUG` set, the recompiler's registers at each entry
# and exit and its native code in `/tmp/pvm_native.bin`. They show a
# kernel's steps and registers, which never leave the prover role: no
# production build enables it (`just check-no-debug-internals`).
debug-internals = []

[dependencies]
libc = { version = "0.2", optional = true }
memoffset = { version = "0.9", optional = true }
vos-pvm-program = { path = "../program" }
# The Poseidon2-M31 permutation the `0x402` precompile computes.
vos-pvm-poseidon2 = { path = "../proof/poseidon2" }
# Not a workspace dependency: workspace pins enable default features, and
# vos_pvm's always-compiled modules must stay no_std-clean.
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
proptest = "1"
serde_json = "1"
