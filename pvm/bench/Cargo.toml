[package]
name = "vos-pvm-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Benches and cross-host checks for the VOS PVM, with their guest programs."

[dependencies]
vos-pvm = { workspace = true }
vos-pvm-compiler = { workspace = true }
vos-pvm-proof = { workspace = true }
vos-pvm-program = { workspace = true }
# The reference Poseidon2 compression the precompile is checked against.
vos-pvm-poseidon2 = { workspace = true }
blake2 = "0.10"
lz4_flex = "0.11"
libc = "0.2"
# Format 35's proof bytes, for the proof's size.
postcard = { version = "1", features = ["alloc"] }

[features]
# Bench tests that prove: memory-heavy, so they run with the prover suites
# (`just test-bench-proof`), never in the pre-push checks.
prove = []

[[test]]
name = "diverse_proof"
required-features = ["prove"]

[[test]]
name = "precompile_tamper"
required-features = ["prove"]
