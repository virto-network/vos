[package]
name = "vos-pvm-compiler"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "RISC-V ELF to VOS PVM compiler"

[dependencies]
vos-pvm = { path = "../runtime" }
vos-pvm-program = { path = "../program" }
thiserror = "2"
tracing = "0.1"
# Function names for a profiler, as source spells them.
rustc-demangle = "0.1.24"

[dev-dependencies]
proptest = "1"
