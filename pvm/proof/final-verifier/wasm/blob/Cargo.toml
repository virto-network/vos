[workspace]

# The final verifier and the venue's check over it as a Wasm blob built the way a Substrate runtime is:
# `wasm32-unknown-unknown`, `-C target-cpu=mvp`, `-Z build-std=core,alloc`
# (substrate-wasm-builder's fallback when `wasm32v1-none` is absent), memory
# imported, and every allocation through sp-io's host allocator ABI
# (`ext_allocator_{malloc,free}_version_1`), as `RuntimeAllocator` does.
# Its own workspace: stwo resolves verify-only. Build with
# `cargo build --release` here, the production blob, linking format 39
# alone; with `--features test-formats` (into another target directory), the
# test blob, linking format 28 beside it for the test policy's fixtures.
# `../run` measures them.
[package]
name = "vos-pvm-final-verifier-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Format 28 beside 39: the test blob's (`just judge-wasm`). The production
# blob never enables it (`just check-no-test-formats`).
test-formats = ["vos-statement/test-formats"]

[dependencies]
vos-pvm-final-verifier = { path = "../.." }
vos-statement = { path = "../../../statement" }
# The golden vectors' digests, `anchor_digests`.
vos-anchor = { path = "../../../anchor", features = ["vectors"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
