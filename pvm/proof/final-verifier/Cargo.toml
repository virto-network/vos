[package]
name = "vos-pvm-final-verifier"
edition.workspace = true
version.workspace = true
license = "GPL-3.0-or-later"
description = "The final wrap's verifier: a format-39 proof (masked, its fixed layout) against its 24 public words, the program id and the io-hash. no_std, for x86, wasm32 and the PVM."

[dependencies]
# Without features: no std, and none of the prover's nightly SIMD.
stwo = { workspace = true }
vos-pvm-recair-air = { workspace = true }
num-traits = { version = "0.2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
# Format 39's registry entry and the segment transcript's
# header, which this crate's constants and header must equal.
vos-pvm-proof = { workspace = true }
