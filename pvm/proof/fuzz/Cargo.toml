[package]
name = "vos-pvm-proof-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# This subcrate intentionally does NOT inherit the workspace —
# `cargo fuzz` builds it under its own settings (libFuzzer
# instrumentation, custom rustc flags) and a workspace member
# would conflict.  Pin deps via `path` to the same source tree.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
vos-pvm = { path = "../../runtime" }
vos-pvm-proof = { path = ".." }
vos-pvm-proof-verifier = { path = "../verifier" }
# The final verifier on the bytes a venue receives: arbitrary bytes, and the
# golden wraps' bytes and structure mutated, formats 28 and 39.
vos-pvm-final-verifier = { path = "../final-verifier", features = ["test-formats"] }
vos-statement = { path = "../statement", features = ["fixtures"] }
# A space's genesis, anchors, migrations and golden vectors, as a venue
# decodes them.
vos-anchor = { path = "../anchor", features = ["vectors"] }
# The node API's frame reader and operator envelope, as a node reads them.
vos-api = { path = "../../../node/api" }
vos-wire = { path = "../../../agent/wire" }
postcard = { version = "1", features = ["alloc"] }
stwo = { git = "https://github.com/olanod/stwo", rev = "c3ec981357a0053e373e00f1057ec5a62675f7eb", default-features = false }

# Skip the test profile's default panic strategy override;
# libfuzzer-sys requires panic=abort on its own targets.
[profile.release]
debug = 1
panic = "abort"

[profile.dev]
panic = "abort"

[[bin]]
name = "prove_verify_roundtrip"
path = "fuzz_targets/prove_verify_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "final_verifier_bytes"
path = "fuzz_targets/final_verifier_bytes.rs"
test = false
doc = false

[[bin]]
name = "final_verifier_mutate"
path = "fuzz_targets/final_verifier_mutate.rs"
test = false
doc = false

[[bin]]
name = "statement_decode"
path = "fuzz_targets/statement_decode.rs"
test = false
doc = false

[[bin]]
name = "masked_bytes"
path = "fuzz_targets/masked_bytes.rs"
test = false
doc = false

[[bin]]
name = "masked_shape"
path = "fuzz_targets/masked_shape.rs"
test = false
doc = false

[[bin]]
name = "anchor_decode"
path = "fuzz_targets/anchor_decode.rs"
test = false
doc = false

[[bin]]
name = "api_reader"
path = "fuzz_targets/api_reader.rs"
test = false
doc = false

[[bin]]
name = "operated_decode"
path = "fuzz_targets/operated_decode.rs"
test = false
doc = false
