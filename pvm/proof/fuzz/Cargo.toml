[package]
name = "vos-pvm-proof-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# This subcrate intentionally does NOT inherit the workspace —
# `cargo fuzz` builds it under its own settings (libFuzzer
# instrumentation, custom rustc flags) and a workspace member
# would conflict.  Pin deps via `path` to the same source tree.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
vos-pvm = { path = "../../runtime" }
vos-pvm-proof = { path = ".." }
vos-pvm-proof-verifier = { path = "../verifier" }
# The final verifier on the bytes a venue receives: arbitrary bytes, and the
# golden wraps' bytes and structure mutated, formats 28 and 39.
vos-pvm-final-verifier = { path = "../final-verifier", features = ["test-formats"] }
vos-statement = { path = "../statement", features = ["fixtures"] }
postcard = { version = "1", features = ["alloc"] }
stwo = { git = "https://github.com/olanod/stwo", rev = "ab294189b34fac653e0a753971c69a0d39d01d16", default-features = false }

# Skip the test profile's default panic strategy override;
# libfuzzer-sys requires panic=abort on its own targets.
[profile.release]
debug = 1
panic = "abort"

[profile.dev]
panic = "abort"

[[bin]]
name = "prove_verify_roundtrip"
path = "fuzz_targets/prove_verify_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "final_verifier_bytes"
path = "fuzz_targets/final_verifier_bytes.rs"
test = false
doc = false

[[bin]]
name = "final_verifier_mutate"
path = "fuzz_targets/final_verifier_mutate.rs"
test = false
doc = false

[[bin]]
name = "statement_decode"
path = "fuzz_targets/statement_decode.rs"
test = false
doc = false

# A temporary local pin, replaced by the re-pin to the pushed rev: the Stwo
# fork's `vos/verify-panics` (c3ec981, the DEEP quotient's degenerate lines
# refused) from its local worktree.
[patch."https://github.com/olanod/stwo"]
stwo = { path = "/home/daniel/src/virto/stwo-s6-panics/crates/stwo" }
stwo-constraint-framework = { path = "/home/daniel/src/virto/stwo-s6-panics/crates/constraint-framework" }
