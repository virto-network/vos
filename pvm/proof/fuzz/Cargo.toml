[package]
name = "vos-pvm-proof-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

# This subcrate intentionally does NOT inherit the workspace —
# `cargo fuzz` builds it under its own settings (libFuzzer
# instrumentation, custom rustc flags) and a workspace member
# would conflict.  Pin deps via `path` to the same source tree.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
vos-pvm = { path = "../../runtime" }
vos-pvm-proof = { path = ".." }
vos-pvm-proof-verifier = { path = "../verifier" }
# The final verifier on the bytes a venue receives: arbitrary bytes, and the
# golden wrap's bytes and structure mutated.
vos-pvm-final-verifier = { path = "../final-verifier" }
vos-statement = { path = "../statement", features = ["fixtures"] }
# A space's genesis, anchors, migrations and golden vectors, as a venue
# decodes them.
vos-anchor = { path = "../anchor", features = ["vectors"] }
# The device verifier on the bytes ingress receives, under a small kernel's
# program the assembler builds.
vos-pvm-device = { path = "../device" }
vos-pvm-compiler = { path = "../../compiler" }
# The device proof's encoding, its interaction PoW nonce written again.
postcard = { version = "1", features = ["alloc"] }
# The JAM statements service's refine, on the work items a JAM node gives.
vos-statement-service = { path = "../statement/service" }
stwo = { git = "https://github.com/olanod/stwo", rev = "e14925a81606b4d68c6a5d3047d382a20bd953d3", default-features = false }

# Skip the test profile's default panic strategy override;
# libfuzzer-sys requires panic=abort on its own targets.
[profile.release]
debug = 1
panic = "abort"

[profile.dev]
panic = "abort"

[[bin]]
name = "prove_verify_roundtrip"
path = "fuzz_targets/prove_verify_roundtrip.rs"
test = false
doc = false

