[package]
name = "vos-pvm-proof"
edition.workspace = true
version.workspace = true
license = "Apache-2.0"

[features]
default = ["prover", "wire"]
# Prover-side: trace generation, proof creation, the tracer, blake3 commitments,
# and parallel iteration.  Disable for a verifier-only build (smaller dep tree,
# no_std-friendly, builds for wasm32-unknown-unknown).
#
# `javm` (the reference PVM interpreter the tracer drives) is prover-only:
# the verifier never executes PVM code, and javm does not build on 32-bit
# targets (CODE_WINDOW_SIZE = 1 << 32 overflows usize), so it must stay out
# of the wasm32 verifier graph.
#
# The stwo `std`/`prover`/`parallel` features are forwarded here rather than
# pinned at the workspace `[workspace.dependencies]` entry: workspace-inherited
# features are additive (a member cannot remove them), and the verifier-only
# build needs feature-less stwo (no rayon).  Proof types and verification are
# in stwo's always-compiled core, so the verifier path needs no stwo features.
prover = [
    "dep:vos-pvm",
    "vos-pvm-poseidon2/packed",
    "dep:rayon",
    "dep:blake3",
    "stwo/std",
    "stwo/prover",
    "stwo/parallel",
    "stwo-constraint-framework/std",
    "stwo-constraint-framework/prover",
    "stwo-constraint-framework/parallel",
    "serde/std",
    "num-traits/std",
]
# A kernel's shape read from its install's record (`vos_wire::records::Shape`).
wire = ["dep:vos-wire"]
# Diagnostic helpers (`debug_claimed_sums`) for prover-side debugging of
# logup imbalances.  Off by default so the production prover surface
# stays clean; turn on with `--features debug-internals` to bisect
# "ConstraintsNotSatisfied" vs. "claimed logup sum is not zero" failure
# modes when adding constraints; and `prove_chip_isolated_format`, a
# chip's proof alone, which the recursion prover's tests measure a leaf on.
debug-internals = ["prover"]

[dependencies]
vos-pvm-proof-derive = { workspace = true }
vos-pvm = { workspace = true, optional = true }
stwo = { workspace = true }
stwo-constraint-framework = { workspace = true }
# NOT workspace-inherited (workspace-inherited features are additive and the
# workspace pins carry default features = std): a verify-only build must stay
# libstd-free so a no_std runtime (e.g. a wasm PVF built with -Zbuild-std) can
# link the verifier without a duplicate-lang-item clash against its own panic
# handler. The `prover` feature adds `serde/std` / `num-traits/std` back for
# native prover builds.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
num-traits = { version = "0.2", default-features = false }
impl-trait-for-tuples = { workspace = true }
# A kernel's entry, its registers as the loader lays it out, and its hash.
vos-pvm-program = { workspace = true }
vos-pvm-precompiles = { path = "precompiles", default-features = false, features = ["blake2b"] }
# The Poseidon2-M31 permutation and its modes, which the Poseidon2-M31
# channel's hasher and transcript adapt.
vos-pvm-poseidon2 = { workspace = true }
vos-wire = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
blake3 = { version = "1", optional = true }

[dev-dependencies]
vos-pvm-compiler = { workspace = true }
# The agent's reference model and the test actors it runs (`just
# build-test-actors`): a kernel's live run, which the prover's re-run of
# it must match.
vos-testkit = { path = "../../agent/testkit" }
bincode = "1"
# The wrap's wire format, which the final verifier decodes.
postcard = { version = "1", features = ["alloc"] }
vos-pvm-proof-verifier = { workspace = true }
# The window kernel's arguments: a space's pseudo-account rows in a tree at
# two versions, their multiproofs, and the statement they make.
cipher-clerk = { workspace = true, features = ["settlement"] }
vos-tree = { workspace = true }
# The kernels' leaves: a segment verified in its leaf circuit, proved and
# verified on the recursion AIR; and the window's wrap, verified by the
# final verifier; the fixtures' masked wraps, from the seeded seam
# (`seeded-masks`, a dev edge: no production build has it).
vos-pvm-recair = { workspace = true, features = ["seeded-masks"] }
# Format 28's verifier beside format 39's: the test policy's fixtures and
# the kernels' wraps are 28.
vos-pvm-final-verifier = { workspace = true, features = ["test-formats"] }
# The golden statements: their types, the venue's check, the fixtures'
# encoding, and the venue's JAM refine program on the JAM-only host.
vos-statement = { workspace = true, features = ["fixtures"] }

# Both examples demonstrate the prover end-to-end; mark them
# prover-only so a verifier-only build (`--no-default-features`) skips
# them instead of failing on the unresolved prover surface. (Examples
# can't use a `#![cfg]` gate like the integration tests — a cfg'd-out
# example has no `main`.)
# On-device proving benchmark (mobile-proving plan, ARM bring-up): the
# binary to cross-compile for aarch64 and run on a phone.  A [[bin]]
# rather than an example so a cross-build pulls only the prover's own
# dependency tree — examples/tests build against dev-deps (git + local
# path crates) that have no business in a device image.
[[bin]]
name = "mobile_bench"
required-features = ["prover"]

[[example]]
name = "multi_segment"
required-features = ["prover"]

[[example]]
name = "prove_and_verify"
required-features = ["prover"]

# Proving benchmarks (measurement, not correctness — see benches/prove.rs).
# `harness = false` + a custom `main` keeps them out of `cargo test` and runs
# them serially (one prove at a time, so large traces never contend for RAM).
#   cargo bench --bench prove                 # default safe set
#   cargo bench --bench prove -- log16        # a specific heavy one
[[bench]]
name = "prove"
harness = false
required-features = ["prover"]

# Poseidon2-M31 hashing throughput (see benches/poseidon2.rs).
[[bench]]
name = "poseidon2"
harness = false
required-features = ["prover"]

[lints.clippy]
module-inception = { level = "allow", priority = 0 }
# AIR fill code is byte-position-indexed throughout (val_b[0..8],
# carry chains, schoolbook positions).  `for i in 0..8 { col[i] =
# ... }` is the natural shape; the iterator-based clippy suggestion
# (`for (i, item) in col.iter_mut().enumerate()`) obscures that
# `i` is a position in the constrained byte layout.
needless_range_loop = { level = "allow", priority = 0 }
# Lookup-tuple builders take many small arguments by design (one
# per column); collapsing them into a struct-arg would just rename
# the same parameters.
too_many_arguments = { level = "allow", priority = 0 }
# Hand-formatted ASCII tables / continuation lines in doc-comments
# don't always satisfy the markdown 2-space-indent rule; the
# rendered output is fine in both rustdoc and our review tooling.
doc_lazy_continuation = { level = "allow", priority = 0 }
