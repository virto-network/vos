[package]
name = "vos-statement"
edition.workspace = true
version.workspace = true
license = "Apache-2.0"
description = "A proved statement as a venue judges it: its types, its canonical encoding, its io-hash and id, and the venue's check of a final proof against it. no_std, with no dependency on VOS beyond the final verifier."

[features]
# The golden fixtures' reader (`fixtures`), for the venues' harnesses: std.
fixtures = ["vos-anchor/vectors"]
# The venue as a JAM refine program (`src/bin/final-verify.rs`), for the
# PVM target only: no_main, its own allocator and panic handler.
pvm-guest = ["vos-anchor/vectors"]

[[bin]]
name = "final-verify"
required-features = ["pvm-guest"]
test = false
bench = false

# The golden fixtures judged natively and on the JAM-only host.
[[test]]
name = "fixtures"
required-features = ["fixtures"]

[dependencies]
# Format 28, the final proofs `judge` reads.
vos-pvm-final-verifier = { workspace = true, features = ["test-formats"] }
# A space's id, its roots and their encodings, re-exported.
vos-anchor = { workspace = true }

[dev-dependencies]
# The io-hash a kernel computes, which a statement's must equal.
vos-pvm-precompiles = { workspace = true }
# The JAM-only host the guest runs on, and its linker.
vos-pvm = { workspace = true }
vos-pvm-compiler = { workspace = true }
