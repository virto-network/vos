[package]
name = "vwb-gen"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Full vos-pvm-proof (default features = prover) — this member is native-only.
vos-pvm-proof = { path = "../.." }
# Native cross-check verify uses the exact same code path the wasm build runs.
vos-pvm-proof-verifier = { path = "../../verifier" }
# Use the runtime owned by this repository.
vos-pvm = { path = "../../../runtime" }
postcard = { version = "1", features = ["alloc"] }

[features]
# Diagnostic pass-through: `cargo build -p vwb-gen --features debug-internals`
# lets `binding` pinpoint chip/row/constraint on ConstraintsNotSatisfied.
debug-internals = ["vos-pvm-proof/debug-internals"]
