[package]
name = "vos-pvm-recair"
edition.workspace = true
version.workspace = true
license = "Apache-2.0"
description = "The recursion AIR's prover: circuits built by a Context, their wiring checked, traced, proved and verified on the Poseidon2-M31 channel."

[dependencies]
vos-pvm-recair-air = { workspace = true }
# The wrap's proof, its public words and its layout, which the prover
# produces and the final verifier reads.
vos-pvm-final-verifier = { workspace = true }
vos-pvm-poseidon2 = { workspace = true }
# The Poseidon2-M31 channel and its SIMD backend, the format registry, the
# transcript's header and the security accounting.
vos-pvm-proof = { workspace = true }
# A kernel's install record, which a leaf's program is computed from.
vos-wire = { workspace = true }
stwo = { workspace = true, features = ["std", "prover", "parallel"] }
stwo-constraint-framework = { workspace = true, features = ["std", "prover", "parallel"] }
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
bincode = "1"
# The compiler's tests: a segment proof's OODS data, from the fixture and
# from a run proved over every chip.
postcard = { version = "1", features = ["alloc"] }
vos-pvm = { workspace = true }
# A small kernel, laid out as the loader lays it out.
vos-pvm-program = { workspace = true }
# A derivation's leaf rows, held to the built leaves.
vos-pvm-compiler = { workspace = true }
# The shape's security counts against the standalone verifier's.
vos-pvm-proof-verifier = { workspace = true }
# The venue's JAM refine program, run on the JAM-only host.
vos-statement = { workspace = true }
# A chip-isolated proof, COMPARE's leaf's (`prove_chip_isolated_format`).
vos-pvm-proof = { workspace = true, features = ["debug-internals"] }
