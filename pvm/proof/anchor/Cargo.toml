[package]
name = "vos-anchor"
edition.workspace = true
version.workspace = true
license = "GPL-3.0-or-later"
description = "A space's identity, its window clock, its roots and their anchors at a venue: the types, their canonical SCALE encodings and the digests a venue checks signatures over. no_std, with BLAKE2b its one dependency."

[features]
# The golden vectors (`vectors`), which the venues' harnesses compute.
vectors = []
# The venue rules' suite (`suite`), which each venue's tests run.
suite = []

[dependencies]
# BLAKE2b-256, every digest's; without std.
blake2 = { version = "0.10", default-features = false }

[lints.rust]
# No `unsafe` in the crate, set here rather than in its source: the agent's
# guests link it through `vos-abi`, and a line added above its code would
# move their panic locations and so their program ids.
unsafe_code = "forbid"

[dev-dependencies]
# The small-order keys checked against the curve's own arithmetic.
curve25519-dalek = "4"
ed25519-dalek = "2"
