# A SEPARATE, self-contained workspace for the verify-only Poseidon2-M31 stwo
# settlement verifier that compiles for wasm32 AND the PVM (riscv64em-vos)
# target with NO blst and NO rayon. It verifies a single light segment proof
# on-chain (the Track-A path; see vos-pvm-proof/docs/plans/recursion-decision.md).
#
# It is its OWN `[workspace]` (and is in the vos root `exclude` list) so its
# Cargo feature resolution never co-resolves with `javm`/prover-stwo: feature
# unification is per-workspace-per-target, and the vos workspace pins stwo with
# `std,prover,parallel` (which drag rayon, and javm drags blst).  Here stwo is
# pinned `default-features = false` — no std, no prover, no parallel.
[package]
name = "vos-pvm-settlement-verifier"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Verify-only Poseidon2-M31 stwo settlement verifier (wasm32 + JAM PVM)"

[features]
# Build the `settle` PVM ELF (no_main + bump allocator + _start). Gated so host
# / wasm32 `cargo build` skips the bare-metal bin.
pvm-settle = []

[[bin]]
name = "settle"
required-features = ["pvm-settle"]

[workspace]

[dependencies]
# stwo at the vos workspace's pinned rev. The fork makes `dashmap` (std-only,
# prover-only) optional + prover-gated, so this `default-features = false` build
# (no std, no prover, no parallel) does not drag crossbeam-utils + lock_api on
# the no_std/no-atomics PVM / wasm32 targets.
stwo = { git = "https://github.com/olanod/stwo", rev = "bbfa8bc3ae8ce958ee70d4bc59b8436bb453b3ef", default-features = false }
stwo-constraint-framework = { git = "https://github.com/olanod/stwo", rev = "bbfa8bc3ae8ce958ee70d4bc59b8436bb453b3ef", default-features = false }
num-traits = { version = "0.2", default-features = false }
# The Poseidon2-M31 permutation and its modes, shared with the prover.
vos-pvm-poseidon2 = { path = "../poseidon2" }
# The segment verifier's check that a proof's limbs are canonical, and, in the
# tests, the prover's Poseidon2-M31 channel, which the channel copy here must
# draw alike; verifier-only, so stwo stays without std, prover or parallel.
vos-pvm-proof = { path = "..", default-features = false }
# no_std + alloc wire format for the embedded settlement proof fixture (the same
# format vos-pvm-proof's `settle_fixture` test serializes).
postcard = { version = "1", default-features = false, features = ["alloc"] }
# stwo's `vcs::hash::Hash` supertrait requires Serialize + Deserialize (proofs
# serialize); serde+derive is no_std-friendly, so it is not a wasm/PVM blocker.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
