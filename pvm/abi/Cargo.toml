[package]
name = "vos-abi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The actor ABI: the host calls, the identifiers, the key layout, the schema, the records of an install, a step's result and the messages between agents, and the JAM invocation's arguments."

[dependencies]
scale = { package = "vos-pvm-codec", path = "../codec", default-features = false, features = ["anchor"] }
# The space an agent belongs to, and the clock that numbers its windows.
vos-anchor = { path = "../proof/anchor" }
# The Gray Paper's naturals, which the JAM invocation's arguments are in.
vos-pvm-program = { workspace = true }
# The key transforms every table's rows are keyed by.
vos-tree = { workspace = true }
# BLAKE2b-256 of a whole buffer: pages' and, on JAM, work results' hashes;
# the Poseidon2-M31 compression the credential tree hashes with.
vos-pvm-precompiles = { workspace = true }

[dev-dependencies]
vos-pvm = { workspace = true }
