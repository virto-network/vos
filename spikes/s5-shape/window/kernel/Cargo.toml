[workspace]

[package]
name = "window-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# cipher-clerk hashes through the BLAKE2b precompile (its `pvm-precompile`
# feature, whose shim the actor's workspace patches to vos-core's). Without
# it, `PseudoAccount::of` hashes with the `blake2` crate in software.
precompile = ["cipher-clerk/pvm-precompile"]

[dependencies]
cipher-clerk = { git = "https://codeberg.org/Virto/CipherClerk.git", tag = "v0.3.0", default-features = false, features = ["settlement"] }
vos-pvm-precompiles = { path = "../../../../pvm/proof/precompiles", default-features = false, features = ["blake2b"] }
