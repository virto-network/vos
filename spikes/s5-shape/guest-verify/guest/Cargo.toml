[workspace]

# The segment verifier (`vos-pvm-proof-verifier`) as a JAM refine program for
# vos-core's guest target (`pvm/guest`). One build reads every admitted
# format (run-time selection: 31, Poseidon2-M31; 33, Blake2s). Its own
# workspace, so the verifier's stwo resolves verify-only (no std, no prover,
# no parallel); stwo is the owner's fork at the vos workspace's pin, which
# the verifier's `workspace = true` dependencies inherit.
[package]
name = "s5-shape-guest-verify"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "verify"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vos-pvm-proof-verifier = { path = "../../../../pvm/proof/verifier" }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
