# vos-core's guest recipe (`pvm/guest/config.toml`), with the linker
# script's path from this crate.
[target.riscv64em-vos-atomic]
rustflags = [
    "-Zunstable-options",
    "-Clink-arg=-T../../../../pvm/guest/pvm.ld",
]

[unstable]
json-target-spec = true
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
