[workspace]
resolver = "3"
members = [
    "agent/wire",
    "agent/sdk",
    "agent/sdk-macros",
    "agent/testkit",
    "agent/tree",
    "node/host",
    "node/api",
    "node/http",
    "node/gateway",
    "node/net",
    "node/cli",
    "node/checker",
    "node/jam",
    "node/venue",
    "node/prover",
    "support/vos-raft",
    "support/merkle-crdt",
    "pvm/runtime",
    "pvm/compiler",
    "pvm/program",
    "pvm/codec",
    "pvm/codec-derive",
    "pvm/proof",
    "pvm/proof/precompiles",
    "pvm/proof/poseidon2",
    "pvm/proof/recair-air",
    "pvm/proof/recair",
    "pvm/proof/final-verifier",
    "pvm/proof/statement",
    "pvm/proof/statement/service",
    "pvm/proof/anchor",
    "pvm/proof/derive",
    "pvm/proof/verifier",
    "pvm/bench",
    "tools/jam-dev",
    "tools/scale",
]
# A plain `cargo build` builds what ships: the development crates (the
# checker, the JAM tooling, the scale harness) enable test features of the
# node's crates, which a root build would unify into `vos`.
default-members = [
    "agent/wire",
    "agent/sdk",
    "agent/sdk-macros",
    "agent/testkit",
    "agent/tree",
    "node/host",
    "node/api",
    "node/http",
    "node/gateway",
    "node/net",
    "node/cli",
    "node/jam",
    "node/venue",
    "node/prover",
    "support/vos-raft",
    "support/merkle-crdt",
    "pvm/runtime",
    "pvm/compiler",
    "pvm/program",
    "pvm/codec",
    "pvm/codec-derive",
    "pvm/proof",
    "pvm/proof/precompiles",
    "pvm/proof/poseidon2",
    "pvm/proof/recair-air",
    "pvm/proof/recair",
    "pvm/proof/final-verifier",
    "pvm/proof/statement",
    "pvm/proof/statement/service",
    "pvm/proof/anchor",
    "pvm/proof/derive",
    "pvm/proof/verifier",
    "pvm/bench",
]
exclude = [
    # Built with `cargo fuzz` (nightly flags, panic = abort).
    "pvm/proof/fuzz",
    "pvm/bench/guests",
    "agent/test-actors",
    "agent/default",
    "agent/credentials",
    # The final verifier's Wasm blob and its measuring runner: each its own
    # workspace, the blob verify-only for wasm32, the runner on wasmtime.
    "pvm/proof/final-verifier/wasm",
    # Throwaway measurement code from the design runs.
    "spikes",
]

# fjall's lsm-tree: 3.1.10 with three fixes, each on a branch of the fork:
# a popped memtable is freed outside the version history's write lock
# (`free-popped-memtables-off-lock`), a flush or a compaction no longer
# makes a write batch visible in part (`batch-visible-whole`), and its
# tests' clock is per thread (`per-thread-test-clock`). This is the fork's
# `vos` branch, which merges the three.
[patch.crates-io]
lsm-tree = { git = "https://github.com/olanod/lsm-tree", rev = "d0791931a96ff2be9b23af4e0d1ef17a330ed9f2" }


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://codeberg.org/Virto/VOS"
homepage = "https://github.com/virto-network/vos"
authors = ["Daniel Olano <daniel@olanod.com>"]
readme = "README.md"

[profile.release]
lto = "fat"
codegen-units = 1

# fjall's journal decoder debug-asserts on a torn item header, which its
# release build recovers from as an incomplete tail: test recovery as the
# node runs it.
[profile.dev.package.fjall]
debug-assertions = false
[profile.test.package.fjall]
debug-assertions = false

[profile.dev.package.vos-pvm]
opt-level = 3
[profile.test.package.vos-pvm]
opt-level = 3
# Linking an agent's program takes seconds unoptimized: a node process
# a test restarts starts in time only with it optimized.
[profile.dev.package.vos-pvm-compiler]
opt-level = 3
[profile.test.package.vos-pvm-compiler]
opt-level = 3

# The final wrap hashes with Blake2b-256 (RustCrypto's `blake2`): its
# Merkle trees and its PoW grind.
[profile.dev.package.blake2]
opt-level = 3
[profile.test.package.blake2]
opt-level = 3
[profile.dev.package.stwo]
opt-level = 3
[profile.test.package.stwo]
opt-level = 3
[profile.dev.package.stwo-constraint-framework]
opt-level = 3
[profile.test.package.stwo-constraint-framework]
opt-level = 3
[profile.dev.package.vos-pvm-proof]
opt-level = 3
[profile.test.package.vos-pvm-proof]
opt-level = 3
[profile.dev.package.vos-pvm-proof-verifier]
opt-level = 3
[profile.test.package.vos-pvm-proof-verifier]
opt-level = 3
# The window kernel's test builds a tree of a million rows, hashing in
# software.
[profile.dev.package.vos-tree]
opt-level = 3
[profile.test.package.vos-tree]
opt-level = 3
[profile.dev.package.vos-pvm-precompiles]
opt-level = 3
[profile.test.package.vos-pvm-precompiles]
opt-level = 3
[profile.dev.package.vos-pvm-poseidon2]
opt-level = 3
[profile.test.package.vos-pvm-poseidon2]
opt-level = 3
# The recursion AIR's prover: its tests prove.
[profile.dev.package.vos-pvm-recair-air]
opt-level = 3
[profile.test.package.vos-pvm-recair-air]
opt-level = 3
[profile.dev.package.vos-pvm-final-verifier]
opt-level = 3
[profile.test.package.vos-pvm-final-verifier]
opt-level = 3
[profile.dev.package.vos-statement]
opt-level = 3
[profile.test.package.vos-statement]
opt-level = 3
[profile.dev.package.vos-pvm-recair]
opt-level = 3
[profile.test.package.vos-pvm-recair]
opt-level = 3
# The masked wrap's randomness: ChaCha20 streams for every mask and salt.
[profile.dev.package.rand_chacha]
opt-level = 3
[profile.test.package.rand_chacha]
opt-level = 3
[profile.dev.package.ppv-lite86]
opt-level = 3
[profile.test.package.ppv-lite86]
opt-level = 3

[workspace.dependencies]
# Exact: the workspace nightly is a 1.90 pre-release, which a later fjall
# release may outgrow. At least 3.1.13: before it, a database's drop could
# block for good on a full queue of close messages its workers had all
# stopped taking.
fjall = "=3.1.13"
vos-pvm-proof = { path = "pvm/proof" }
vos-pvm-proof-derive = { path = "pvm/proof/derive" }
vos-pvm-proof-verifier = { path = "pvm/proof/verifier" }
vos-pvm-precompiles = { path = "pvm/proof/precompiles" }
vos-pvm-poseidon2 = { path = "pvm/proof/poseidon2" }
vos-pvm-recair-air = { path = "pvm/proof/recair-air" }
vos-pvm-recair = { path = "pvm/proof/recair" }
vos-pvm-final-verifier = { path = "pvm/proof/final-verifier" }
vos-statement = { path = "pvm/proof/statement" }
vos-anchor = { path = "pvm/proof/anchor" }
vos-statement-service = { path = "pvm/proof/statement/service" }
vos-pvm = { path = "pvm/runtime" }
vos-pvm-compiler = { path = "pvm/compiler" }
vos-pvm-program = { path = "pvm/program" }
vos-pvm-codec = { path = "pvm/codec", default-features = false }
vos-pvm-codec-derive = { path = "pvm/codec-derive" }
vos-wire = { path = "agent/wire" }
vos-tree = { path = "agent/tree" }
vos-net = { path = "node/net" }
vos-api = { path = "node/api" }
vos-http = { path = "node/http" }
vos-jam = { path = "node/jam" }
vos-venue = { path = "node/venue" }
vos-node-prover = { path = "node/prover" }
vos-raft = { path = "support/vos-raft" }
vos-sdk = { path = "agent/sdk" }
vos-sdk-macros = { path = "agent/sdk-macros" }
# The settlement window, which the window test actor's kernel states.
cipher-clerk = { git = "https://codeberg.org/Virto/CipherClerk.git", tag = "v0.3.0", default-features = false }

# Stwo from the fork's `vos/wrap` branch: upstream `e1286720` with dashmap
# optional, Poseidon252 behind a feature, and upstream's `74951f79`, which
# lets the verifier accept a preprocessed tree below the lifting height
# (`vos/base`); then the final wrap's Blake2b-256 Merkle hasher and channel,
# FRI fold step 3 reviewed, affine DEEP batching opt-in per configuration,
# and errors in place of panics on a malformed last layer and on
# inconsistent queried values.
# Declared without features: workspace features are additive, and the
# verifier-only build must stay free of std and rayon. The prover adds
# `std,prover,parallel` through vos-pvm-proof's `prover` feature.
stwo = { git = "https://github.com/olanod/stwo", rev = "c3ec981357a0053e373e00f1057ec5a62675f7eb", default-features = false }
stwo-constraint-framework = { git = "https://github.com/olanod/stwo", rev = "c3ec981357a0053e373e00f1057ec5a62675f7eb", default-features = false }

num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
rayon = "1.10"
impl-trait-for-tuples = "0.2.2"
subtle = { version = "2.6", default-features = false }
