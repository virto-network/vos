[workspace]
resolver = "3"
members = [
    "agent/wire",
    "agent/sdk",
    "agent/sdk-macros",
    "agent/testkit",
    "node/host",
    "node/exec",
    "node/light",
    "node/api",
    "node/http",
    "node/gateway",
    "node/net",
    "node/cli",
    "node/checker",
    "node/venue",
    "node/prover",
    "node/kernel-tests",
    "support/vos-raft",
    "support/merkle-crdt",
    "support/mls",
    "pvm/runtime",
    "pvm/compiler",
    "pvm/program",
    "pvm/codec",
    "pvm/codec-derive",
    "pvm/tree",
    "pvm/abi",
    "pvm/proof",
    "pvm/proof/precompiles",
    "pvm/proof/poseidon2",
    "pvm/proof/recair-air",
    "pvm/proof/recair",
    "pvm/proof/device",
    "pvm/proof/final-verifier",
    "pvm/proof/statement",
    "pvm/proof/statement/service",
    "pvm/proof/anchor",
    "pvm/proof/derive",
    "pvm/proof/verifier",
    "pvm/bench",
    "tools/jam",
    "tools/jam-dev",
    "tools/kreivo",
    "tools/scale",
    "tools/phone",
    "tools/keeper",
]
# A plain `cargo build` builds what ships: the development crates (the
# checker, the kernel tests, the JAM tooling, Kreivo's client, the scale
# harness, the phone bench) enable test features of the node's crates,
# which a root build would unify into `vos`.
default-members = [
    "agent/wire",
    "agent/sdk",
    "agent/sdk-macros",
    "agent/testkit",
    "node/host",
    "node/exec",
    "node/light",
    "node/api",
    "node/http",
    "node/gateway",
    "node/net",
    "node/cli",
    "node/venue",
    "node/prover",
    "support/vos-raft",
    "support/merkle-crdt",
    "support/mls",
    "pvm/runtime",
    "pvm/compiler",
    "pvm/program",
    "pvm/codec",
    "pvm/codec-derive",
    "pvm/tree",
    "pvm/abi",
    "pvm/proof",
    "pvm/proof/precompiles",
    "pvm/proof/poseidon2",
    "pvm/proof/recair-air",
    "pvm/proof/recair",
    "pvm/proof/device",
    "pvm/proof/final-verifier",
    "pvm/proof/statement",
    "pvm/proof/statement/service",
    "pvm/proof/anchor",
    "pvm/proof/derive",
    "pvm/proof/verifier",
    "pvm/bench",
    "tools/keeper",
]
exclude = [
    # Built with `cargo fuzz` (nightly flags, panic = abort).
    "pvm/proof/fuzz",
    "node/fuzz",
    "pvm/bench/guests",
    "agent/test-actors",
    # The agent's guest programs (`programs.toml`), whose crates name it
    # as their workspace.
    "agent/programs",
    # The final verifier's Wasm blob and its measuring runner: each its own
    # workspace, the blob verify-only for wasm32, the runner on wasmtime.
    "pvm/proof/final-verifier/wasm",
    # The s4 demo and its end-to-end test: s4's crates, built with
    # `--ignore-rust-version` (`just test-gateway-ssh`).
    "node/gateway/demo",
    # The `vos.credential` facility on s4's crates, built with
    # `--ignore-rust-version` (`just test-facility`).
    "node/light/android",
]

# fjall's lsm-tree: 3.1.10 with three fixes, each on a branch of the fork:
# a popped memtable is freed outside the version history's write lock
# (`free-popped-memtables-off-lock`), a flush or a compaction no longer
# makes a write batch visible in part (`batch-visible-whole`), and its
# tests' clock is per thread (`per-thread-test-clock`). This is the fork's
# `vos` branch, which merges the three.
#
# fjall: 3.1.13 taking its directory's lock with `flock` where the standard
# library cannot lock files (Android), on the fork's `android-flock` branch;
# `vos` is the same commit.
[patch.crates-io]
lsm-tree = { git = "https://github.com/olanod/lsm-tree", rev = "d0791931a96ff2be9b23af4e0d1ef17a330ed9f2" }
fjall = { git = "https://github.com/olanod/fjall", rev = "cffa5f7620be864277f7d5706a9f60e58beed219" }


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://codeberg.org/Virto/VOS"
homepage = "https://github.com/virto-network/vos"
authors = ["Daniel Olano <daniel@olanod.com>"]
readme = "README.md"

# Dev and test builds keep line tables alone (a backtrace names its file
# and line), and dependencies no debug info: full debug info made a
# worktree's `target/` tens of GB and its links slow. The test profile
# inherits dev's, its package overrides among them, so each is set once.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1

# fjall's journal decoder debug-asserts on a torn item header, which its
# release build recovers from as an incomplete tail: test recovery as the
# node runs it.
[profile.dev.package.fjall]
debug-assertions = false

[profile.dev.package.vos-pvm]
opt-level = 3
# Linking an agent's program takes seconds unoptimized: a node process
# a test restarts starts in time only with it optimized.
[profile.dev.package.vos-pvm-compiler]
opt-level = 3

# The final wrap hashes with Blake2b-256 (RustCrypto's `blake2`): its
# Merkle trees and its PoW grind.
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.stwo]
opt-level = 3
[profile.dev.package.stwo-constraint-framework]
opt-level = 3
[profile.dev.package.vos-pvm-proof]
opt-level = 3
[profile.dev.package.vos-pvm-proof-verifier]
opt-level = 3
# The window kernel's test builds a tree of a million rows, hashing in
# software.
[profile.dev.package.vos-tree]
opt-level = 3
[profile.dev.package.vos-pvm-precompiles]
opt-level = 3
[profile.dev.package.vos-pvm-poseidon2]
opt-level = 3
# The recursion AIR's prover: its tests prove.
[profile.dev.package.vos-pvm-recair-air]
opt-level = 3
[profile.dev.package.vos-pvm-final-verifier]
opt-level = 3
[profile.dev.package.vos-statement]
opt-level = 3
[profile.dev.package.vos-pvm-recair]
opt-level = 3
[profile.dev.package.vos-pvm-device]
opt-level = 3
# The masked wrap's randomness: ChaCha20 streams for every mask and salt.
[profile.dev.package.rand_chacha]
opt-level = 3
[profile.dev.package.ppv-lite86]
opt-level = 3
# Ed25519 signing and strict verification: merkle-crdt's suites sign and
# check every node of thousands of generated DAGs.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[workspace.dependencies]
# s4, by git revision: the gateway's SSH port. The facility and the demo,
# outside the workspace, name the same revision (`just pin-s4 <rev>`
# moves every one; the facility's `tests/pin.rs` holds them equal).
s4-server = { git = "https://codeberg.org/Virto/s4", rev = "345d4e49a4a90d3b8a4a56b51bde9be888806348" }
# Exact: the workspace nightly is a 1.90 pre-release, which a later fjall
# release may outgrow. At least 3.1.13: before it, a database's drop could
# block for good on a full queue of close messages its workers had all
# stopped taking.
fjall = "=3.1.13"
vos-pvm-proof = { path = "pvm/proof" }
vos-pvm-proof-derive = { path = "pvm/proof/derive" }
vos-pvm-proof-verifier = { path = "pvm/proof/verifier" }
vos-pvm-precompiles = { path = "pvm/proof/precompiles" }
vos-pvm-poseidon2 = { path = "pvm/proof/poseidon2" }
vos-pvm-recair-air = { path = "pvm/proof/recair-air" }
vos-pvm-recair = { path = "pvm/proof/recair", default-features = false }
vos-pvm-device = { path = "pvm/proof/device" }
vos-pvm-final-verifier = { path = "pvm/proof/final-verifier" }
vos-light = { path = "node/light" }
merkle-crdt = { path = "support/merkle-crdt" }
vos-mls = { path = "support/mls" }
vos-statement = { path = "pvm/proof/statement" }
vos-anchor = { path = "pvm/proof/anchor" }
vos-statement-service = { path = "pvm/proof/statement/service" }
vos-pvm = { path = "pvm/runtime" }
vos-pvm-compiler = { path = "pvm/compiler" }
vos-pvm-program = { path = "pvm/program" }
vos-wire = { path = "agent/wire" }
vos-abi = { path = "pvm/abi" }
vos-tree = { path = "pvm/tree" }
vos-exec = { path = "node/exec" }
vos-net = { path = "node/net" }
vos-api = { path = "node/api" }
vos-http = { path = "node/http" }
vos-jam = { path = "tools/jam" }
vos-kreivo = { path = "tools/kreivo" }
vos-venue = { path = "node/venue" }
vos-node-prover = { path = "node/prover" }
vos-raft = { path = "support/vos-raft" }
vos-sdk = { path = "agent/sdk" }
vos-sdk-macros = { path = "agent/sdk-macros" }
# The settlement window, which the window test actor's kernel states.
cipher-clerk = { git = "https://codeberg.org/Virto/CipherClerk.git", tag = "v0.3.0", default-features = false }

# Stwo from the fork's `vos/wrap` branch: upstream `e1286720` with dashmap
# optional, Poseidon252 behind a feature, and upstream's `74951f79`, which
# lets the verifier accept a preprocessed tree below the lifting height
# (`vos/base`); then the final wrap's Blake2b-256 Merkle hasher and channel,
# FRI fold step 3 reviewed, affine DEEP batching opt-in per configuration,
# and errors in place of panics on a malformed last layer and on
# inconsistent queried values; then the PoW grind in chunks of 2^14
# nonces, the smallest kept (`vos/grind-chunks`), and the SIMD backend's
# Blake2s-M31 digest words reduced canonically over the whole u32 range,
# as the verifier reduces them (`vos/simd-m31-reduce`); then Blake2s's
# 16-lane compression run as four NEON groups of four on aarch64, the
# same words (`vos/neon-compress16`).
# Declared without features: workspace features are additive, and the
# verifier-only build must stay free of std and rayon. The prover adds
# `std,prover,parallel` through vos-pvm-proof's `prover` feature.
stwo = { git = "https://github.com/olanod/stwo", rev = "e14925a81606b4d68c6a5d3047d382a20bd953d3", default-features = false }
stwo-constraint-framework = { git = "https://github.com/olanod/stwo", rev = "e14925a81606b4d68c6a5d3047d382a20bd953d3", default-features = false }

serde = { version = "1", features = ["derive"] }
rayon = "1.10"
impl-trait-for-tuples = "0.2.2"
