[package]
name = "merkle-crdt"
description = "A no_std replica for operation-based Merkle-CRDTs, after Sanjuán et al.: one sync scope's DAG of nodes signed by their authors in numbered chains, applied incrementally in causal order onto a storage-backed CRDT; the caller fetches, and nodes that arrive before their parents are held, within bounds."
keywords = ["crdt", "merkle", "no-std", "p2p"]
categories = ["data-structures", "no-std", "algorithms"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["std"]
# `std::error::Error` for `Error`, and ed25519-dalek's std.
std = ["ed25519-dalek/std"]

[dependencies]
# Each node's author signature.
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "zeroize"] }

[dev-dependencies]
blake2 = "0.10"
proptest = "1"

[[bench]]
name = "apply"
harness = false
