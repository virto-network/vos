[package]
name = "merkle-crdt"
description = "Generic no_std Merkle-CRDTs: a DAG of signed, authored nodes per sync scope, applied incrementally in causal order, fetched in batches from a peer that walks the DAG or from a cursor over a server that cannot. Used by VOS for the Merge lane."
keywords = ["crdt", "merkle", "no-std", "p2p", "vos"]
categories = ["data-structures", "no-std", "algorithms"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["fjall"]
std = ["ed25519-dalek/std"]
# The `Store` over fjall, the light node's database.
fjall = ["std", "dep:fjall"]

[dependencies]
# Each node's author signature.
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "zeroize"] }
fjall = { workspace = true, optional = true }

[dev-dependencies]
blake2 = "0.10"
proptest = "1"
tempfile = "3"

[[bench]]
name = "apply"
harness = false
