[workspace]

[package]
name = "agent-runtime"
description = "Bundled standard agent runtime for VOS"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/virto-network/vos"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
experimental-state-blocks = ["vos/experimental-state-blocks"]

[target.'cfg(target_arch = "riscv64")'.dependencies]
vos = { path = "../../vos", version = "0.1.0", default-features = false, features = ["agent-runtime"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
