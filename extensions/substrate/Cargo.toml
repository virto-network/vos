[package]
name = "substrate-extension"
description = "Bounded VOS actor gateway to Substrate light clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["bin", "native"]
# Enables the cdylib entry points emitted by the VOS actor macros.
bin = []
# Host implementation. Ref-only actor dependencies disable default features,
# leaving just the no_std wire types and generated SubstrateExtensionRef.
native = ["dep:sube", "dep:zstd"]

[lib]
crate-type = ["rlib", "cdylib"]

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(feature, values("pvm", "service", "extension", "wasm"))']

[target.'cfg(target_arch = "riscv64")'.dependencies]
vos = { path = "../../vos", default-features = false, features = ["macros", "service"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
vos = { path = "../../vos", default-features = false, features = ["macros", "wasm-bootstrap"] }

[target.'cfg(not(any(target_arch = "riscv64", target_arch = "wasm32")))'.dependencies]
vos = { path = "../../vos", default-features = false, features = ["macros", "extension"] }

[dependencies]
# Immutable reviewable Sube revision. This supplies snapshot pagination,
# external V4 signing, and a joinable smoldot std platform.
sube = { git = "https://github.com/virto-network/virto-sdk", rev = "fb1d677720b9e2ebac8102674825deedde23c097", default-features = false, features = ["smoldot-std"], optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
log = { version = "0.4", features = ["std"] }
smol = "2"
