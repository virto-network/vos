[package]
name = "vos-jam-dev"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Development and test tooling for JAM, which no VOS node links: a PolkaJam node's JSON-RPC and `jamt`, a JAM statements service's client and a node's venue over it (`JamVenue`), and `vos-jam-dev`, which links a JAM service blob, runs an agent on a PolkaJam testnet, and deploys and drives the statements service there."
publish = false

[[bin]]
name = "vos-jam-dev"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
serde_json = "1"
tracing = "0.1"
vos-anchor = { workspace = true }
vos-jam = { workspace = true }
# A run's client signs its calls as a VOS client does.
vos-node = { path = "../../node/host" }
vos-pvm = { workspace = true }
vos-pvm-compiler = { workspace = true }
vos-pvm-program = { workspace = true }
# The golden fixtures' masked statements, which `vos-jam-dev statements`
# submits to a JAM statements service.
vos-statement = { workspace = true, features = ["fixtures"] }
vos-statement-service = { workspace = true }
vos-tree = { workspace = true }
vos-venue = { workspace = true }
vos-wire = { workspace = true }
