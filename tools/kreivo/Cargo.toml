[package]
name = "vos-kreivo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Development and test tooling for Kreivo's spaces pallet, which no VOS node links: a venue client of the pallet over a transport, its reference mock and a transport over it, and the conformance vectors the mock writes."
publish = false

[package.metadata.vos]
test-features = { kreivo-mock = ["venue-model", "venue-mock"] }
test-package = ["tools"]

[features]
# The reference mock of the pallet and a transport over it, for the node's
# tests.
kreivo-mock = []

[dependencies]
blake2 = "0.10"
ed25519-dalek = "2"
# The spaces pallet's calls, events and stored values in SCALE, FRAME's
# bytes; its storage keys hashed as FRAME's hashers do (`twox128`,
# `twox64`, `blake2_128`).
parity-scale-codec = { version = "3.7.5", features = ["derive", "std"] }
tracing = "0.1"
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }
vos-anchor = { workspace = true }
vos-statement = { workspace = true }
vos-venue = { workspace = true }

[dev-dependencies]
# The conformance vectors, as JSON.
serde = { workspace = true }
serde_json = "1"
# The venue rules' suite, run over the mock.
vos-anchor = { workspace = true, features = ["suite"] }
# The golden fixtures the vectors submit, and their format-39 proofs'
# fields, which the mutation lists tamper.
vos-statement = { workspace = true, features = ["fixtures"] }
vos-pvm-final-verifier = { workspace = true }
stwo = { workspace = true }
