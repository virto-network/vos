[package]
name = "vos-scale"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The scale test's harness, which no VOS node links: an inventory of LAN hosts checked, a space deployed on them over ssh, its nodes started and stopped as user units, agents placed by weight, a load driven, and each run's samples collected and reported."
publish = false

[[bin]]
name = "vos-scale"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
libc = "0.2"
# The allocator `vos` uses: a driver's clients free across threads.
mimalloc = "0.1.52"
serde = { workspace = true }
serde_json = "1"
# The drivers' sending thread: one executor, its connections and timers.
smol = "2"
toml = "1"
# The harness's clients: the operator's signed commands and the agents'
# reads, each node's API over QUIC pinned by its key.
vos-node = { path = "../../node/host" }
# The drivers over the node API: its frames and its QUIC.
vos-api = { workspace = true, features = ["quic"] }
vos-net = { workspace = true }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-smol", "rustls-ring"] }
# The gateway's cost, measured in front of a node from the coordinator.
vos-gateway = { path = "../../node/gateway" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
vos-pvm = { workspace = true }
vos-wire = { workspace = true }

[dev-dependencies]
tempfile = "3"
vos-checker = { path = "../../node/checker" }
