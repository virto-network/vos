[package]
name = "vos-scale"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The scale test's harness, which no VOS node links: an inventory of LAN hosts checked, a space deployed on them over ssh, its nodes started and stopped as user units, agents placed by weight, a load driven, and each run's samples collected and reported."
publish = false

[[bin]]
name = "vos-scale"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
futures-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hex = "0.4"
httparse = "1"
libc = "0.2"
# The allocator `vos` uses: a driver's clients free across threads.
mimalloc = "0.1.52"
serde = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
# The drivers' sending thread: one executor, its connections and timers.
smol = "2"
toml = "1"
# The harness's clients: the operator's admin commands and signed calls,
# each node pinned by its key over TLS.
vos-node = { path = "../../node/host" }
vos-pvm = { workspace = true }
vos-wire = { workspace = true }

[dev-dependencies]
tempfile = "3"
